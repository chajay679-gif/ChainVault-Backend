spring.application.name=chainvault

# Render assigns a dynamic port
server.port=${PORT:8080}

# Database settings injected via Render environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuned for Railway + Render free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT settings
jwt.secret=${JWT_SECRET:ChainVaultDefaultSecretKeyChangeThisInRenderEnvironment2026XyZ1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}
